# Integration tests run against an in-memory H2 database in MySQL compatibility mode,
# so they need no MySQL server. (Production and local development use MySQL 8.)
spring.datasource.url=jdbc:h2:mem:worktrack_test;MODE=MySQL;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=15000
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
# The MySQL migration scripts are for MySQL; the in-memory test database is built by Hibernate.
spring.flyway.enabled=false

# Never create an administrator automatically during tests
worktrack.admin.email=
worktrack.admin.password=

# Tests decide when a notification batch runs, and never send mail
worktrack.notifications.worker.enabled=false
worktrack.mail.mode=log
