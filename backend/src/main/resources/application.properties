spring.application.name=worktrack

# Optional local ".env" file (KEY=VALUE per line) in the directory where you start the app.
# It is git-ignored. Real environment variables always work too. See .env.example.
spring.config.import=optional:file:.env[.properties]

server.port=${SERVER_PORT:8080}

# ---------------------------------------------------------------------------
# Session cookie (server-side session; the browser only holds an opaque id)
# ---------------------------------------------------------------------------
server.servlet.session.timeout=30m
server.servlet.session.cookie.name=WORKTRACK_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# SECURE BY DEFAULT: the cookie is only sent over HTTPS (also applies to the XSRF-TOKEN cookie).
# For plain-HTTP local development set SESSION_COOKIE_SECURE=false in your .env (see .env.example).
# Browsers treat http://localhost as a secure context, but Safari and some tools do not.
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
# The session id is only ever carried in the cookie, never in a URL (;jsessionid=...).
server.servlet.session.tracking-modes=cookie
# Behind a reverse proxy / load balancer that terminates HTTPS set FORWARD_HEADERS_STRATEGY=native so the
# app sees the real client IP (login throttling) and knows the request was HTTPS (HSTS). Leave "none"
# when clients connect directly: otherwise anyone could fake their IP with an X-Forwarded-For header.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}

# ---------------------------------------------------------------------------
# Sign-in throttling (see LoginAttemptLimiter). Defaults shown; override with env vars if needed.
# ---------------------------------------------------------------------------
worktrack.security.login.max-failures=${LOGIN_MAX_FAILURES:5}
worktrack.security.login.max-failures-per-ip=${LOGIN_MAX_FAILURES_PER_IP:30}
worktrack.security.login.window-minutes=${LOGIN_WINDOW_MINUTES:15}
worktrack.security.login.base-lock-seconds=${LOGIN_BASE_LOCK_SECONDS:60}
worktrack.security.login.max-lock-minutes=${LOGIN_MAX_LOCK_MINUTES:15}

# ---------------------------------------------------------------------------
# Database (MySQL 8). The password has NO default on purpose: startup fails
# with "Could not resolve placeholder 'DB_PASSWORD'" until you provide it.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:worktrack}?sslMode=${DB_SSL_MODE:PREFERRED}&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}

# Schema changes are made ONLY by Flyway (database/migrations/ at the repository root, packaged as classpath:db/migration). On a new empty database it
# runs V1, V2, ...; on a database that already has WorkTrack tables but no Flyway history (created by an
# older version of this project) it baselines at version 1 and applies what is newer.
# Hibernate then only VALIDATES that the entities match the tables, and never alters them.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---------------------------------------------------------------------------
# One-time initial administrator (created only when no ADMIN exists yet)
# ---------------------------------------------------------------------------
worktrack.admin.name=${WORKTRACK_ADMIN_NAME:}
worktrack.admin.email=${WORKTRACK_ADMIN_EMAIL:}
worktrack.admin.password=${WORKTRACK_ADMIN_PASSWORD:}

# Never leak internals in Spring's fallback error responses
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# ---------------------------------------------------------------------------
# E-mail notifications (leave submitted / approved / rejected)
# ---------------------------------------------------------------------------
# mode=log (default): nothing is sent, a log line is written. Safe for development.
# mode=smtp: real e-mail. Needs MAIL_HOST, WORKTRACK_MAIL_FROM and usually MAIL_USERNAME / MAIL_PASSWORD
# (put them in your git-ignored .env or in real environment variables, never in this file).
# The public address people use to open WorkTrack. Used for the links inside e-mails (invitation, leave requests).
# Set WORKTRACK_BASE_URL in production, for example https://worktrack.your-company.example
worktrack.base-url=${WORKTRACK_BASE_URL:http://localhost:8080}
# How long an invitation link (first-login password setup) stays valid.
worktrack.invitation.ttl-hours=${INVITATION_TTL_HOURS:72}
worktrack.mail.mode=${WORKTRACK_MAIL_MODE:smtp}
worktrack.mail.from=${WORKTRACK_MAIL_FROM:}
worktrack.mail.from-name=${WORKTRACK_MAIL_FROM_NAME:WorkTrack}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS_REQUIRED:true}
# Short timeouts: a hung mail server must never hold a worker for long (lease-seconds must stay larger).
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Retry policy: attempt 1 now; after a temporary failure wait base, 2x base, 4x base ... up to the maximum.
worktrack.notifications.worker.enabled=${NOTIFICATIONS_WORKER_ENABLED:true}
worktrack.notifications.poll-ms=${NOTIFICATIONS_POLL_MS:5000}
worktrack.notifications.max-attempts=${NOTIFICATIONS_MAX_ATTEMPTS:6}
worktrack.notifications.base-delay-seconds=${NOTIFICATIONS_BASE_DELAY_SECONDS:60}
worktrack.notifications.max-delay-minutes=${NOTIFICATIONS_MAX_DELAY_MINUTES:360}
worktrack.notifications.lease-seconds=${NOTIFICATIONS_LEASE_SECONDS:120}
worktrack.notifications.batch-size=${NOTIFICATIONS_BATCH_SIZE:20}

# Every log line carries the request's correlation id (also returned as the X-Request-Id header).
logging.pattern.level=%5p [%X{correlationId:-}]

# Report exports refuse to build files larger than this many rows (narrow the filters instead).
worktrack.export.max-rows=${EXPORT_MAX_ROWS:50000}
