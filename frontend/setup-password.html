<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="no-referrer">
  <title>Set your password · WorkTrack</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/login.css">
</head>
<body class="login-page">
  <button type="button" class="btn btn--ghost btn--icon theme-corner" id="theme-toggle"></button>
  <main class="login">
    <div class="login__form-side">
      <div class="login__brand">
        <svg class="brand__mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
          <rect width="32" height="32" rx="9" fill="#ffc53d"/>
          <path d="M11 8v3.5M21 8v3.5" stroke="#0d4f4c" stroke-width="2.4" stroke-linecap="round"/>
          <path d="M8.5 14.5h15" stroke="#0d4f4c" stroke-width="2.2" stroke-linecap="round"/>
          <path d="M11.5 20.5l3 3 6-6.5" stroke="#0d4f4c" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>WorkTrack</span>
      </div>

      <div class="login__intro">
        <h1>Welcome. Choose your password.</h1>
        <p>This is a one-time step. After it you can sign in with your work email and the password you choose.</p>
      </div>

      <form class="login__card" id="setup-form" novalidate>
        <div id="setup-banner" role="alert"></div>
        <div class="field" data-field="password">
          <label for="password">New password</label>
          <div class="input-group">
            <input class="input" id="password" name="password" type="password" autocomplete="new-password" maxlength="72" required>
            <button type="button" class="btn btn--ghost btn--icon btn--sm input-group__btn" id="toggle-password"></button>
          </div>
          <p class="field__hint">8 to 72 characters with at least one letter and one number.</p>
          <p class="field__error"></p>
        </div>
        <div class="field" data-field="confirm">
          <label for="confirm">Repeat the password</label>
          <input class="input" id="confirm" name="confirm" type="password" autocomplete="new-password" maxlength="72" required>
          <p class="field__error"></p>
        </div>
        <button type="submit" class="btn btn--accent" id="setup-submit">Save password</button>
      </form>

      <p class="login__note"><a href="/login.html">Back to sign in</a></p>
    </div>
    <div class="login__art" aria-hidden="true"></div>
  </main>
  <noscript><p class="banner banner--error">WorkTrack needs JavaScript to run. Please turn it on and reload.</p></noscript>
  <script type="module" src="/js/pages/setup-password.js"></script>
</body>
</html>
